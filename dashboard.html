<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JASZCWEB — Dashboard</title><link rel="stylesheet" href="css/style.css"></head><body><div class="app"><aside id="sidebar" class="sidebar"></aside><main><header id="topbar" class="topbar"></header><section class="content"><div class="page-head"><div><div class="eyebrow">YOUR COMMUNITIES</div><h1 id="hello">Welcome.</h1><p>Choose a community or make your own.</p></div><button class="btn primary" id="newCommunity">+ Create community</button></div><div id="communityGrid" class="grid"></div><div class="join-row"><input id="joinCode" placeholder="Enter an invite code"><button class="btn secondary" id="joinCommunity">Join community</button></div></section></main></div><div id="communityModal" class="modal hidden"><div class="modal-card"><button class="close" data-close="communityModal">×</button><div class="eyebrow">NEW COMMUNITY</div><h2>Make your space.</h2><label>Name<input id="cName" maxlength="50"></label><label>Slug<input id="cSlug" maxlength="30" placeholder="my-community"></label><label>Description<textarea id="cDesc" maxlength="180"></textarea></label><button class="btn primary wide" id="createCommunity">Create →</button><div id="cMsg" class="msg"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/app.js"></script><script src="js/dashboard.js"></script></body></html>
