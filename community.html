<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JASZCWEB — Community</title><link rel="stylesheet" href="css/style.css"></head><body><div class="app"><aside id="sidebar" class="sidebar"></aside><main><header id="topbar" class="topbar"></header><section class="chat-layout"><aside class="channels"><div class="channel-head"><div><small>COMMUNITY</small><b id="communityName">Community</b></div><button id="settingsBtn">⚙</button></div><div class="section-label">TEXT CHANNELS <button id="newChannel">+</button></div><div id="channels"></div><div class="online">● <span id="online">members</span></div></aside><section class="chat"><header><div><h2 id="channelTitle"># general</h2><span>Real-time community chat</span></div><div><button id="membersBtn" class="icon">👥</button><button id="inviteBtn" class="icon">↗</button></div></header><div id="messages" class="messages"></div><form id="sendForm"><input id="messageInput" maxlength="2000" autocomplete="off" placeholder="Message #general"><button class="send">↑</button></form></section></section></main></div><div id="channelModal" class="modal hidden"><div class="modal-card"><button class="close" data-close="channelModal">×</button><div class="eyebrow">NEW CHANNEL</div><h2>Create a channel.</h2><input id="channelName" placeholder="gaming"><button id="createChannel" class="btn primary wide">Create →</button><div id="channelMsg" class="msg"></div></div></div><div id="inviteModal" class="modal hidden"><div class="modal-card"><button class="close" data-close="inviteModal">×</button><div class="eyebrow">INVITE PEOPLE</div><h2>Bring people in.</h2><p>Share this code.</p><div id="inviteCode" class="invite-code">--------</div><button id="copyInvite" class="btn secondary wide">Copy code</button></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/app.js"></script><script src="js/community.js"></script><script src="js/chat.js"></script></body></html>
