<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JASZCWEB — Community</title>
<link rel="stylesheet" href="css/style.css"></head>
<body class="app-body"><div id="appShell" class="app-shell"><aside id="sidebar" class="sidebar"></aside>
<main class="main-content community-main"><header class="topbar"><button class="mobile-toggle" id="mobileToggle">☰</button><div class="crumb" id="crumb">Community</div><div class="top-user" id="topUser"></div></header>
<section class="chat-layout"><aside class="channel-sidebar"><div class="channel-head"><div><small>COMMUNITY</small><strong id="communityName">Community</strong></div><button id="channelSettings" class="icon-btn">⚙</button></div>
<div class="channel-section"><div class="section-label">TEXT CHANNELS <button id="addChannelBtn">+</button></div><div id="channelList"></div></div>
<div class="channel-section"><div class="section-label">VOICE CHANNELS <button id="addVoiceChannelBtn">+</button></div><div id="voiceChannelList"></div></div>
<div class="online-box"><span class="status-dot"></span><span id="onlineCount">0 online</span></div></aside>
<section class="chat-pane"><header class="chat-header"><div><h2 id="channelTitle"># general</h2><p id="channelTopic">Talk about anything.</p></div><div class="chat-actions"><button class="icon-btn" id="memberPageBtn">👥</button><button class="icon-btn" id="inviteBtn">↗</button></div></header>
<div id="messageList" class="message-list"></div><div id="voicePanel" class="voice-panel hidden"></div>
<form id="messageForm" class="message-form"><input id="replyTo" type="hidden"><button id="cancelReply" class="reply-cancel hidden" type="button">×</button><button id="attachBtn" class="attach-btn" type="button">＋</button><input id="fileInput" type="file" hidden><input id="messageInput" maxlength="2000" autocomplete="off" placeholder="Message #general"><button class="send-btn" type="submit">↑</button></form></section></section></main></div>
<div id="channelModal" class="modal hidden"><div class="modal-card"><button class="modal-x" data-close="channelModal">×</button><div class="eyebrow">NEW CHANNEL</div><h2>Create a channel.</h2><label>Name<input id="channelName" maxlength="40" placeholder="gaming"></label><label>Type<select id="channelType"><option value="text">Text</option><option value="voice">Voice</option></select></label><label>Topic<input id="channelTopicInput" maxlength="120" placeholder="What is this channel for?"></label><button class="btn primary wide" id="createChannelSubmit">Create channel →</button><div id="channelMsg" class="form-msg"></div></div></div>
<div id="inviteModal" class="modal hidden"><div class="modal-card"><button class="modal-x" data-close="inviteModal">×</button><div class="eyebrow">INVITE PEOPLE</div><h2>Bring your people in.</h2><p>Share this code with anyone you want to add.</p><div class="invite-code" id="inviteCode">--------</div><button class="btn secondary wide" id="copyInvite">Copy invite code</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/app.js"></script><script src="js/community.js"></script><script src="js/chat.js"></script><script src="js/voice.js"></script>
</body></html>
