<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JASZCWEB — Profile</title><link rel="stylesheet" href="css/style.css"></head><body class="app-body"><div class="app-shell"><aside id="sidebar" class="sidebar"></aside><main class="main-content"><header class="topbar"><button class="mobile-toggle" id="mobileToggle">☰</button><div class="crumb">JASZCWEB <span>/</span> Profile</div><div class="top-user" id="topUser"></div></header><section class="content narrow"><div class="page-head"><div><div class="eyebrow">ACCOUNT</div><h1>Your profile</h1><p>Make your identity yours.</p></div></div><div class="profile-preview"><div class="profile-banner" id="profileBanner"></div><div class="profile-preview-content"><div class="profile-avatar" id="profileAvatar">J</div><div class="profile-preview-info"><h2 id="profileDisplay">Jaszczur</h2><p id="profileHandle">@jaszczur</p><span class="profile-status" id="profileStatusPreview">Available</span></div></div></div><form id="profileForm" class="settings-card"><div class="settings-section"><h3>Identity</h3><p>What people see when they interact with you.</p><label>Display name<input id="profileName" maxlength="40" placeholder="Jaszczur"></label><label>Username<input id="profileUsername" maxlength="24" pattern="[A-Za-z0-9_]+" placeholder="jaszczur"></label><label>Avatar<input id="profileAvatarFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif"><small class="field-help">PNG/JPG/WEBP/GIF · max 5 MB</small></label><label>Bio<textarea id="profileBio" maxlength="300" placeholder="Tell people a little about yourself..."></textarea></label><div class="two-column"><label>Pronouns<input id="profilePronouns" maxlength="30" placeholder="he/him"></label><label>Status<input id="profileStatus" maxlength="50" placeholder="Grinding on JASZCWEB"></label></div></div><div class="settings-section"><h3>Appearance</h3><p>Choose your colors and theme.</p><label>Accent color<div class="color-row"><input id="profileAccent" type="color" value="#c8ff38"><span id="accentText">#c8ff38</span></div></label><label>Banner color<div class="color-row"><input id="profileBannerColor" type="color" value="#111318"><span id="bannerText">#111318</span></div></label><label>Theme<select id="profileTheme"><option value="dark">Dark</option><option value="light">Light</option></select></label></div><div class="settings-actions"><span id="profileMsg" class="form-msg"></span><button class="btn primary" type="submit">Save profile</button></div></form><button class="btn danger signout" id="signOutBtn">Sign out</button></section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/app.js"></script><script src="js/profile.js"></script></body></html>
