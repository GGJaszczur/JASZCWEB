<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JASZCWEB — Settings</title><link rel="stylesheet" href="css/style.css"></head><body class="app-body"><div class="app-shell"><aside id="sidebar" class="sidebar"></aside><main class="main-content"><header class="topbar"><button class="mobile-toggle" id="mobileToggle">☰</button><div class="crumb">Community <span>/</span> Settings</div><div class="top-user" id="topUser"></div></header><section class="content narrow"><div class="page-head"><div><div class="eyebrow">OWNER CONTROL</div><h1>Community settings</h1><p>Name, look, invite, and basic moderation setup.</p></div></div><form id="settingsForm" class="settings-card"><div class="settings-section"><h3>General</h3><p>Basic information about your community.</p><label>Community name<input id="settingsName" maxlength="50"></label><label>Slug<input id="settingsSlug" maxlength="30"></label><label>Description<textarea id="settingsDescription" maxlength="180"></textarea></label></div><div class="settings-section"><h3>Appearance</h3><p>Make the community look like yours.</p><label>Accent color<div class="color-row"><input id="settingsColor" type="color" value="#c8ff38"><span id="colorText">#c8ff38</span></div></label><label>Banner color<div class="color-row"><input id="settingsBanner" type="color" value="#111318"><span id="bannerText">#111318</span></div></label></div><div class="settings-section"><h3>Invite</h3><p>Give this code to people you want to join.</p><div class="invite-inline"><strong id="settingsInvite">--------</strong><button type="button" class="btn secondary" id="copySettingsInvite">Copy</button></div></div><div class="settings-actions"><span id="settingsMsg" class="form-msg"></span><button class="btn primary" type="submit">Save changes</button></div></form></section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/app.js"></script><script src="js/settings.js"></script></body></html>
